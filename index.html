<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PayPal Vietnam </title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5faf7;
    color: #173b2a;
}

/* ================= LOGIN ================= */

#loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 390px;
    background: white;
    padding: 35px 28px;
    border-radius: 25px;
    box-shadow: 0 15px 45px rgba(30, 90, 55, 0.12);
    text-align: center;
}

.logo {
    width: 70px;
    height: 70px;
    margin: auto;
    border-radius: 22px;
    background: #dff5e7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
}

.login-box h1 {
    margin-top: 16px;
    font-size: 25px;
}

.demo {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #e8f7ed;
    color: #3c9560;
    font-size: 12px;
    font-weight: bold;
}

.login-box p {
    color: #819188;
    margin: 15px 0 25px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #dce9e1;
    border-radius: 13px;
    outline: none;
    font-size: 16px;
    margin-bottom: 12px;
}

input:focus {
    border-color: #65bd86;
}

.primary-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 13px;
    background: #69bd87;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary-btn:hover {
    background: #55ad75;
}

/* ================= APP ================= */

#app {
    display: none;
    min-height: 100vh;
}

header {
    background: white;
    border-bottom: 1px solid #e5eee8;
    padding: 16px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: bold;
}

.brand-icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: #dff5e7;
    display: flex;
    align-items: center;
    justify-content: center;
}

.user-area {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logout {
    border: none;
    padding: 9px 14px;
    border-radius: 10px;
    background: #edf7f0;
    color: #32744b;
    cursor: pointer;
}

/* ================= CONTENT ================= */

.container {
    max-width: 1050px;
    margin: auto;
    padding: 30px 20px;
}

.welcome {
    margin-bottom: 22px;
}

.welcome h2 {
    font-size: 27px;
}

.welcome p {
    margin-top: 6px;
    color: #7d9085;
}

/* ================= BALANCE ================= */

.balance-card {
    position: relative;
    overflow: hidden;
    background: linear-gradient(
        135deg,
        #7dcc98,
        #4eaf73
    );
    color: white;
    padding: 28px;
    border-radius: 25px;
    box-shadow: 0 15px 35px rgba(65, 150, 90, 0.22);
}

.balance-card::before {
    content: "";
    position: absolute;
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background: rgba(255,255,255,.10);
    right: -70px;
    top: -80px;
}

.balance-card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,.06);
    right: 100px;
    bottom: -60px;
}

.balance-label {
    font-size: 13px;
    opacity: .85;
}

.balance {
    font-size: 39px;
    font-weight: bold;
    margin: 12px 0 23px;
}

.account {
    font-size: 13px;
    opacity: .85;
}

/* ================= ACTION ================= */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 22px 0;
}

.action-btn {
    background: white;
    border: 1px solid #e2eee7;
    border-radius: 17px;
    padding: 18px;
    color: #28623e;
    cursor: pointer;
    box-shadow: 0 7px 20px rgba(30,90,50,.06);
    font-size: 15px;
    font-weight: bold;
}

.action-btn:hover {
    transform: translateY(-2px);
}

.action-icon {
    font-size: 28px;
    display: block;
    margin-bottom: 8px;
}

/* ================= TRANSACTIONS ================= */

.section-header {
    margin-top: 30px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.section-header h3 {
    font-size: 20px;
}

.clear-btn {
    background: transparent;
    border: none;
    color: #7b8981;
    cursor: pointer;
}

.transactions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.transaction {
    background: white;
    border: 1px solid #e5eee8;
    border-radius: 17px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.transaction-left {
    display: flex;
    align-items: center;
    gap: 13px;
}

.transaction-icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
}

.income {
    background: #e1f6e8;
}

.expense {
    background: #fff0ee;
}

.transaction-title {
    font-weight: bold;
}

.transaction-time {
    color: #93a198;
    font-size: 12px;
    margin-top: 4px;
}

.amount {
    font-weight: bold;
}

.plus {
    color: #45a968;
}

.minus {
    color: #df6b62;
}

.empty {
    background: white;
    border-radius: 17px;
    padding: 35px;
    text-align: center;
    color: #91a098;
}

/* ================= MODAL ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,40,28,.38);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
}

.modal-box {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 23px;
    padding: 25px;
}

.modal-box h3 {
    margin-bottom: 18px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
}

.modal-buttons button {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-weight: bold;
}

.cancel {
    background: #edf1ee;
    color: #555;
}

.confirm {
    background: #69bd87;
    color: white;
}

/* ================= TOAST ================= */

.toast-container {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.toast {
    min-width: 270px;
    background: white;
    padding: 15px 18px;
    border-radius: 15px;
    border-left: 5px solid #69bd87;
    box-shadow: 0 10px 30px rgba(0,0,0,.13);
    animation: slide .3s ease;
}

.toast strong {
    display: block;
    margin-bottom: 4px;
}

.toast small {
    color: #789184;
}

@keyframes slide {
    from {
        transform: translateX(100px);
        opacity: 0;
    }

    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    header {
        padding: 14px 15px;
    }

    .user-name {
        display: none;
    }

    .container {
        padding: 22px 15px;
    }

    .welcome h2 {
        font-size: 23px;
    }

    .balance {
        font-size: 30px;
    }

    .transaction {
        padding: 13px;
    }

    .amount {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="login-box">

        <div class="logo">💳</div>

        <h1>PayPal Vietnam</h1>

        <span class="demo">DEMO / SIMULATOR</span>

        <p>
            Mô phỏng quản lý tài khoản và số dư
        </p>

        <input
            id="nameInput"
            type="text"
            placeholder="Nhập tên của bạn"
            maxlength="30"
        >

        <button
            class="primary-btn"
            onclick="login()"
        >
            Đăng nhập
        </button>

    </div>

</div>


<!-- APP -->

<div id="app">

<header>

    <div class="brand">

        <div class="brand-icon">
            💳
        </div>

        PayPal Vietnam

    </div>

    <div class="user-area">

        <span
            class="user-name"
            id="headerName">
        </span>

        <button
            class="logout"
            onclick="logout()">
            Thoát
        </button>

    </div>

</header>


<div class="container">

    <div class="welcome">

        <h2>
            Xin chào,
            <span id="welcomeName"></span>
            👋
        </h2>

        <p>
            Quản lý tài khoản mô phỏng của bạn
        </p>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

        <div class="balance-label">
            SỐ DƯ KHẢ DỤNG
        </div>

        <div
            class="balance"
            id="balance">
            0 ₫
        </div>

        <div class="account">
            Tài khoản mô phỏng:
            <span id="accountNumber"></span>
        </div>

    </div>


    <!-- ACTIONS -->

    <div class="actions">

        <button
            class="action-btn"
            onclick="openModal('add')">

            <span class="action-icon">
                ➕
            </span>

            Cộng tiền

        </button>


        <button
            class="action-btn"
            onclick="openModal('subtract')">

            <span class="action-icon">
                ➖
            </span>

            Trừ tiền

        </button>

    </div>


    <!-- TRANSACTIONS -->

    <div class="section-header">

        <h3>
            Biến động số dư
        </h3>

        <button
            class="clear-btn"
            onclick="clearTransactions()">

            Xóa lịch sử

        </button>

    </div>


    <div
        class="transactions"
        id="transactions">
    </div>

</div>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <h3 id="modalTitle">
            Cộng tiền
        </h3>

        <input
            id="amountInput"
            type="number"
            min="1"
            placeholder="Số tiền (VND)"
        >

        <input
            id="noteInput"
            type="text"
            maxlength="50"
            placeholder="Nội dung giao dịch"
        >

        <div class="modal-buttons">

            <button
                class="cancel"
                onclick="closeModal()">

                Hủy

            </button>

            <button
                class="confirm"
                onclick="processTransaction()">

                Xác nhận

            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast-container"
    id="toastContainer">
</div>


<script>

/* ================= DATA ================= */

let currentUser = null;
let transactionType = "add";


/* ================= LOGIN ================= */

function login() {

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if (!name) {

        showToast(
            "⚠️ Thiếu thông tin",
            "Vui lòng nhập tên."
        );

        return;
    }

    currentUser = name;

    localStorage.setItem(
        "paypal_demo_user",
        name
    );

    if (
        !localStorage.getItem(
            "paypal_demo_balance"
        )
    ) {

        localStorage.setItem(
            "paypal_demo_balance",
            "0"
        );
    }

    if (
        !localStorage.getItem(
            "paypal_demo_transactions"
        )
    ) {

        localStorage.setItem(
            "paypal_demo_transactions",
            JSON.stringify([])
        );
    }

    showApp();
}


/* ================= APP ================= */

function showApp() {

    document
        .getElementById("loginPage")
        .style.display = "none";

    document
        .getElementById("app")
        .style.display = "block";

    document
        .getElementById("welcomeName")
        .textContent = currentUser;

    document
        .getElementById("headerName")
        .textContent = currentUser;

    generateAccount();

    updateBalance();

    renderTransactions();
}


/* ================= ACCOUNT ================= */

function generateAccount() {

    let account =
        localStorage.getItem(
            "paypal_demo_account"
        );

    if (!account) {

        account =
            Math.floor(
                1000000000 +
                Math.random() * 9000000000
            );

        localStorage.setItem(
            "paypal_demo_account",
            account
        );
    }

    document
        .getElementById("accountNumber")
        .textContent = account;
}


/* ================= BALANCE ================= */

function getBalance() {

    return Number(
        localStorage.getItem(
            "paypal_demo_balance"
        ) || 0
    );
}


function updateBalance() {

    document
        .getElementById("balance")
        .textContent =
        formatMoney(getBalance());
}


function formatMoney(number) {

    return number.toLocaleString("vi-VN")
        + " ₫";
}


/* ================= MODAL ================= */

function openModal(type) {

    transactionType = type;

    document
        .getElementById("modal")
        .style.display = "flex";

    document
        .getElementById("amountInput")
        .value = "";

    document
        .getElementById("noteInput")
        .value = "";

    document
        .getElementById("modalTitle")
        .textContent =
        type === "add"
        ? "➕ Cộng tiền"
        : "➖ Trừ tiền";

    document
        .getElementById("amountInput")
        .focus();
}


function closeModal() {

    document
        .getElementById("modal")
        .style.display = "none";
}


/* ================= TRANSACTION ================= */

function processTransaction() {

    const amount =
        Number(
            document
            .getElementById("amountInput")
            .value
        );

    const note =
        document
        .getElementById("noteInput")
        .value
        .trim()
        || "Giao dịch mô phỏng";


    if (!amount || amount <= 0) {

        showToast(
            "⚠️ Số tiền không hợp lệ",
            "Hãy nhập số tiền lớn hơn 0."
        );

        return;
    }


    let balance = getBalance();


    if (transactionType === "subtract") {

        if (amount > balance) {

            showToast(
                "❌ Không đủ số dư",
                "Số dư hiện tại không đủ."
            );

            return;
        }

        balance -= amount;

    } else {

        balance += amount;
    }


    localStorage.setItem(
        "paypal_demo_balance",
        balance
    );


    const transactions =
        JSON.parse(
            localStorage.getItem(
                "paypal_demo_transactions"
            ) || "[]"
        );


    transactions.unshift({

        type: transactionType,

        amount: amount,

        note: note,

        time: new Date().toISOString()

    });


    localStorage.setItem(
        "paypal_demo_transactions",
        JSON.stringify(transactions)
    );


    closeModal();

    updateBalance();

    renderTransactions();


    if (transactionType === "add") {

        showToast(
            "💚 Giao dịch thành công",
            "+" + formatMoney(amount)
        );

    } else {

        showToast(
            "💸 Giao dịch thành công",
            "-" + formatMoney(amount)
        );
    }
}


/* ================= HISTORY ================= */

function renderTransactions() {

    const container =
        document.getElementById(
            "transactions"
        );

    const transactions =
        JSON.parse(
            localStorage.getItem(
                "paypal_demo_transactions"
            ) || "[]"
        );


    if (transactions.length === 0) {

        container.innerHTML = `
            <div class="empty">
                📊
                <br><br>
                Chưa có biến động số dư
            </div>
        `;

        return;
    }


    container.innerHTML =
        transactions
        .map(t => {

            const isAdd =
                t.type === "add";

            const sign =
                isAdd ? "+" : "-";

            const time =
                new Date(t.time)
                .toLocaleString("vi-VN");


            return `

                <div class="transaction">

                    <div class="transaction-left">

                        <div class="
                            transaction-icon
                            ${isAdd
                                ? "income"
                                : "expense"}
                        ">

                            ${isAdd
                                ? "↓"
                                : "↑"}

                        </div>


                        <div>

                            <div class="
                                transaction-title
                            ">

                                ${escapeHTML(t.note)}

                            </div>

                            <div class="
                                transaction-time
                            ">

                                ${time}

                            </div>

                        </div>

                    </div>


                    <div class="
                        amount
                        ${isAdd
                            ? "plus"
                            : "minus"}
                    ">

                        ${sign}
                        ${formatMoney(t.amount)}

                    </div>

                </div>

            `;

        })
        .join("");
}


/* ================= CLEAR ================= */

function clearTransactions() {

    if (
        !confirm(
            "Bạn có chắc muốn xóa lịch sử giao dịch?"
        )
    ) {
        return;
    }

    localStorage.setItem(
        "paypal_demo_transactions",
        JSON.stringify([])
    );

    renderTransactions();

    showToast(
        "🗑️ Đã xóa",
        "Lịch sử giao dịch đã được xóa."
    );
}


/* ================= TOAST ================= */

function showToast(title, message) {

    const container =
        document.getElementById(
            "toastContainer"
        );

    const toast =
        document.createElement("div");

    toast.className = "toast";

    toast.innerHTML = `
        <strong>${escapeHTML(title)}</strong>
        <small>${escapeHTML(message)}</small>
    `;

    container.appendChild(toast);


    setTimeout(() => {

        toast.style.opacity = "0";

        toast.style.transform =
            "translateX(100px)";

        setTimeout(() => {

            toast.remove();

        }, 300);

    }, 3000);
}


/* ================= SECURITY ================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================= LOGOUT ================= */

function logout() {

    localStorage.removeItem(
        "paypal_demo_user"
    );

    location.reload();
}


/* ================= AUTO LOGIN ================= */

window.onload = function() {

    const savedUser =
        localStorage.getItem(
            "paypal_demo_user"
        );

    if (savedUser) {

        currentUser = savedUser;

        showApp();
    }
};


/* ================= ENTER ================= */

document
    .getElementById("nameInput")
    .addEventListener(
        "keydown",
        function(e) {

            if (e.key === "Enter") {
                login();
            }

        }
    );

</script>

</body>
</html>
